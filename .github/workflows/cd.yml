name: CD - Build et déploiement Render

on:
  push:
    branches: [deploy/render]
  workflow_dispatch:

jobs:
  build:
    name: Build de l'image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backend/Dockerfile
          push: false
          tags: detection-ia-backend:ci

  deploy:
    name: Déploiement sur Render
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le déploiement du backend
        env:
          HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: curl -fsS "$HOOK"

      - name: Déclencher le déploiement du frontend
        env:
          HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: curl -fsS "$HOOK"